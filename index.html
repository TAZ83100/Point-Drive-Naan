<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Point Drive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #f0f0f0; font-family: Arial, sans-serif; min-height: 100vh; padding: 12px; }
  .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 3px solid #CC0000; gap: 2px; }
  .logo { font-size: 28px; font-weight: 900; color: #111; letter-spacing: -1px; }
  .logo span { color: #CC0000; font-style: italic; }
  .logo-sub { font-size: 11px; color: #888; font-style: italic; text-align: center; }
  .status { font-size: 11px; color: #555; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 5px; }
  .display-zone { background: #222; border: 3px solid #555; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; transition: border-color 0.2s; }
  .display-zone.active { border-color: #CC0000; }
  .display-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .display-number { font-size: 52px; font-weight: 900; color: white; line-height: 1; min-height: 52px; display: flex; align-items: center; }
  .display-number.empty { color: #555; font-size: 28px; }
  .cursor { display: inline-block; width: 3px; height: 44px; background: #CC0000; margin-left: 4px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 8px; }
  .option-btn { background: #2e7d32; border: 2px solid #1b5e20; border-radius: 7px; padding: 14px 8px; color: #111; font-size: 15px; font-weight: 900; text-align: center; cursor: pointer; text-transform: uppercase; user-select: none; transition: all 0.12s; }
  .option-btn:active { transform: scale(0.96); }
  .option-btn.active { background: #e8f5e9; border-color: #2e7d32; color: #1b5e20; text-decoration: line-through; }
  .reset-btn { width: 100%; background: #6d4c41; border: 2px solid #4e342e; border-radius: 7px; padding: 12px; color: #111; font-size: 15px; font-weight: 900; text-align: center; cursor: pointer; text-transform: uppercase; user-select: none; margin-bottom: 12px; transition: all 0.12s; }
  .reset-btn:active { transform: scale(0.98); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 10px; }
  .key { background: #CC0000; border: 2px solid #990000; border-radius: 8px; height: 75px; font-size: 34px; font-weight: 900; color: #111; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; transition: all 0.1s; }
  .key:active { background: #aa0000; transform: scale(0.94); }
  .key.del { background: #6d4c41; border-color: #4e342e; font-size: 16px; }
  .key.clr { background: #6d4c41; border-color: #4e342e; font-size: 15px; }
  .print-btn { width: 100%; background: #CC0000; color: white; border: none; border-radius: 10px; height: 80px; font-size: 26px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.12s; display: flex; align-items: center; justify-content: center; gap: 10px; user-select: none; }
  .print-btn:active { background: #990000; transform: scale(0.98); }
  .print-btn:disabled { background: #bbb; color: #eee; cursor: default; transform: none; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #22c55e; color: white; padding: 12px 28px; border-radius: 30px; font-size: 16px; font-weight: 900; opacity: 0; transition: all 0.3s; white-space: nowrap; z-index: 400; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #print-screen { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:white; z-index:500; align-items:center; justify-content:center; }
  #print-screen.on { display:flex; }
  @media print {
    @page { size: 50mm 25mm landscape; margin: 0; }
    * { visibility: hidden !important; }
    #print-screen, #print-screen img { visibility: visible !important; }
    #print-screen { display: flex !important; position: fixed !important; top:0 !important; left:0 !important; width:50mm !important; height:25mm !important; background:white !important; }
    #print-screen img { width:50mm !important; height:25mm !important; }
  }
</style>
</head>
<body>
 
<div id="main">
  <div class="header">
    <div class="logo">POINT <span>Drive</span></div>
    <div class="logo-sub">Colle cet autocollant sur ton emballage 🍔</div>
    <div class="status"><span class="dot"></span>Prêt</div>
  </div>
  <div class="display-zone" id="dz">
    <div class="display-label">N° de commande</div>
    <div class="display-number empty" id="dn">
      <span id="nt">---</span><span class="cursor"></span>
    </div>
  </div>
  <div class="options-grid">
    <button class="option-btn" onclick="tog(this,'salade')">SANS salade</button>
    <button class="option-btn" onclick="tog(this,'oignon')">SANS oignon</button>
    <button class="option-btn" onclick="tog(this,'tomate')">SANS tomate</button>
    <button class="option-btn" onclick="tog(this,'fromage')">SANS fromage</button>
    <button class="option-btn" onclick="tog(this,'sauce')">SANS sauce</button>
  </div>
  <button class="reset-btn" onclick="resetAll()">↺ RESET TOUT</button>
  <div class="keypad">
    <button class="key" onclick="pk('1')">1</button>
    <button class="key" onclick="pk('2')">2</button>
    <button class="key" onclick="pk('3')">3</button>
    <button class="key" onclick="pk('4')">4</button>
    <button class="key" onclick="pk('5')">5</button>
    <button class="key" onclick="pk('6')">6</button>
    <button class="key" onclick="pk('7')">7</button>
    <button class="key" onclick="pk('8')">8</button>
    <button class="key" onclick="pk('9')">9</button>
    <button class="key clr" onclick="cn()">✕ CLR</button>
    <button class="key" onclick="pk('0')">0</button>
    <button class="key del" onclick="dk()">⌫ SUP</button>
  </div>
  <button class="print-btn" id="pb" disabled onclick="doPrint()">🖨 IMPRIMER</button>
</div>
 
<canvas id="mycanvas" style="display:none;"></canvas>
<div id="print-screen"><img id="label-img" src="" alt="etiquette"></div>
<div class="toast" id="ts"></div>

const labels = {
  salade:'SANS SALADE', oignon:'SANS OIGNON',
  tomate:'SANS TOMATE', fromage:'SANS FROMAGE', sauce:'SANS SAUCE'
};
 
function buildCanvas() {
  const canvas = document.getElementById('mycanvas');
  canvas.width = 400;
  canvas.height = 200;
  const ctx = canvas.getContext('2d');
 
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 400, 200);
 
  const optsArr = Array.from(opts);
 
  const LEFT_W = 140;
 
  // Label "Commande"
  ctx.fillStyle = '#333333';
  ctx.font = 'bold 26px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('Commande', LEFT_W / 2, 20);
 
  // Numéro
  const fs = num.length === 1 ? 90 : num.length === 2 ? 76 : 60;
  ctx.fillStyle = '#000000';
  ctx.font = 'bold ' + fs + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num, LEFT_W / 2, 120);
 
  if (optsArr.length > 0) {
    // Ligne séparatrice verticale
    ctx.strokeStyle = '#aaaaaa';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(LEFT_W, 6);
    ctx.lineTo(LEFT_W, 194);
    ctx.stroke();
 
    const iconMap = {
      salade: 'Salade', oignon: 'Oignon', tomate: 'Tomate', fromage: 'Fromage', sauce: 'Sauce'
    };
    const itemSize = Math.min(42, Math.floor(186 / optsArr.length) - 4);
    const totalH = optsArr.length * (itemSize + 4);
    const startY = (200 - totalH) / 2;
    const startX = LEFT_W + 12;
 
    optsArr.forEach((o, i) => {
      const cy = startY + i * (itemSize + 4) + itemSize / 2;
      const r = itemSize / 2 - 2;
      const cx = startX + r;
 
      // Cercle épais
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
 
      // Barre diagonale épaisse
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.7, cy - r * 0.7);
      ctx.lineTo(cx + r * 0.7, cy + r * 0.7);
      ctx.stroke();
 
      // Nom ingrédient
      const fsi = itemSize <= 28 ? 17 : itemSize <= 34 ? 20 : 22;
      ctx.fillStyle = '#000000';
      ctx.font = 'bold ' + fsi + 'px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(iconMap[o], cx + r + 8, cy);
    });
  }
 
  return canvas.toDataURL('image/png');
}
 
function upd() {
  const nt = document.getElementById('nt');
  const dn = document.getElementById('dn');
  const dz = document.getElementById('dz');
  if (num === '') {
    nt.textContent = '---'; dn.className = 'display-number empty'; dz.classList.remove('active');
  } else {
    nt.textContent = num; dn.className = 'display-number'; dz.classList.add('active');
  }
  document.getElementById('pb').disabled = num === '';
}
 
function pk(k) {
  if (num.length >= 3) return;
  if (num === '' && k === '0') return;
  num += k;
  if (parseInt(num) > 999) num = '999';
  vib(); upd();
}
 
function dk() { if (num.length > 0) { num = num.slice(0,-1); vib(); upd(); } }
function cn() { num = ''; vib(); upd(); }
 
function resetAll() {
  num = ''; opts.clear(); printed = false;
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('print-screen').classList.remove('on');
  document.getElementById('main').style.display = 'block';
  vib(); upd();
}
 
function tog(btn, opt) {
  if (opts.has(opt)) { opts.delete(opt); btn.classList.remove('active'); }
  else { opts.add(opt); btn.classList.add('active'); }
  vib();
}
 
function doPrint() {
  if (!num || printed) return;
  printed = true;
 
  const dataUrl = buildCanvas();
  const img = document.getElementById('label-img');
 
  document.getElementById('main').style.display = 'none';
  document.getElementById('print-screen').classList.add('on');
 
  img.onload = function() {
    setTimeout(() => {
      window.print();
      window.addEventListener('afterprint', function onAfterPrint() {
        window.removeEventListener('afterprint', onAfterPrint);
        showToast('✓ CMD #' + num + ' envoyée !');
        setTimeout(() => resetAll(), 500);
      });
    }, 600);
  };
  img.src = dataUrl;
}
 
function showToast(msg) {
  const t = document.getElementById('ts');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2500);
}
 
function vib() { if (navigator.vibrate) navigator.vibrate(30); }
 
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') pk(e.key);
  else if (e.key === 'Backspace') dk();
  else if (e.key === 'Escape') resetAll();
  else if (e.key === 'Enter' && num) doPrint();
});
</script>
